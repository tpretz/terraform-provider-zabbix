name: release
on:
  push:
    tags:
      # Scoped to v2 deliberately. The original trigger was an unscoped `v*`,
      # which is what most provider repositories use — and restoring that
      # verbatim would let this branch publish over the frozen v0.x release
      # line, which the Registry offers no way to undo.
      - 'v2.*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The second half of the tag scoping, and not redundant: the trigger
    # pattern above is the half that gets widened by accident while editing.
    # If it ever becomes `v*` again, this still refuses a v0.* or v1.* tag.
    if: startsWith(github.ref, 'refs/tags/v2.')
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      -
        # hashicorp/ghaction-import-gpg was archived and its last release is a
        # Node 12 action, which GitHub no longer executes at all — it would fail
        # immediately, not deprecate gracefully. crazy-max/ghaction-import-gpg is
        # the maintained successor; note it takes the key and passphrase as
        # `with:` inputs rather than `env:`, and still exports the `fingerprint`
        # output that the GoReleaser step below consumes.
        name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          # These secrets will need to be configured for the repository:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned, not "latest": whatever goreleaser publishes on release day
          # would otherwise build the artifacts the Registry serves. Bump this
          # deliberately, with a snapshot build to check it, per RELEASING.md.
          version: '~> v2.17'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # GitHub sets this automatically
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
