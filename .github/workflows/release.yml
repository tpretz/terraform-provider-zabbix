# ============================================================================
# DISABLED ON THE v2 BRANCH — see PLAN.md
#
# Nothing in this workflow may execute while the v2 line is under development.
# The v0.x release line is cut from `master`/`testenv` and must not be
# published over by anything on this branch.
#
# Three independent guards, any one of which is sufficient:
#
#   1. No automatic trigger. The original `on: push: tags: ['v*']` is removed;
#      only manual `workflow_dispatch` remains. A `v*` tag pushed from this
#      branch starts nothing.
#   2. A typed confirmation input. Even a manual dispatch is a no-op unless
#      `confirm` is set to the exact string RELEASE.
#   3. A branch guard. The job refuses to run unless dispatched from a ref
#      that is not `v2`.
#
# GitHub Actions is also disabled repository-wide at the moment; this file is
# the belt to that braces, and survives Actions being re-enabled.
#
# TO RE-ENABLE (Phase 0 / at v2.0.0): restore the `push.tags` trigger, drop
# the `confirm` input and the `if:` guard, and add the tag scoping described
# in PLAN.md § "Branch and release strategy" so that only `v2.*` tags reaching
# this workflow can publish.
#
# ----------------------------------------------------------------------------
# Original behaviour, for restoration:
#
#   on:
#     push:
#       tags:
#         - 'v*'
#
# This uses an action (hashicorp/ghaction-import-gpg) that assumes you set your
# private key in the `GPG_PRIVATE_KEY` secret and passphrase in the `PASSPHRASE`
# secret. If you would rather own your own GPG handling, please fork this action
# or use an alternative one for key handling.
#
# You will need to pass the `--batch` flag to `gpg` in your signing step
# in `goreleaser` to indicate this is being used in a non-interactive mode.
# ============================================================================
name: release (disabled on v2)
on:
  # Guard 1: manual only. No tag or push trigger exists on this branch.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to confirm. Anything else is a no-op.'
        required: true
        default: 'no'
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Guards 2 and 3: explicit confirmation, and never from the v2 branch.
    if: >-
      github.event.inputs.confirm == 'RELEASE' &&
      github.ref != 'refs/heads/v2'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      -
        # hashicorp/ghaction-import-gpg was archived and its last release is a
        # Node 12 action, which GitHub no longer executes at all — it would fail
        # immediately, not deprecate gracefully. crazy-max/ghaction-import-gpg is
        # the maintained successor; note it takes the key and passphrase as
        # `with:` inputs rather than `env:`, and still exports the `fingerprint`
        # output that the GoReleaser step below consumes.
        name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          # These secrets will need to be configured for the repository:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned, not "latest": whatever goreleaser publishes on release day
          # would otherwise build the artifacts the Registry serves. Bump this
          # deliberately, with a snapshot build to check it, per RELEASING.md.
          version: '~> v2.17'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # GitHub sets this automatically
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
