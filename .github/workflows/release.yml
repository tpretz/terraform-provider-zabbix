# Publishes release assets when a tag matching "v*" is pushed.
#
# Only needed if you want the provider listed in the public Terraform or
# OpenTofu registries, both of which read releases from GitHub. For private
# consumption see the "Using the provider without a registry" section of the
# README.
#
# Requires two repository secrets:
#   GPG_PRIVATE_KEY - ASCII armoured private key used to sign the checksums
#   PASSPHRASE      - passphrase for that key
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # must satisfy the go directive in go.mod
          go-version-file: 'go.mod'

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
