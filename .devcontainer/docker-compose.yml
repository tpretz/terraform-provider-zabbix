# Devcontainer overlay.
#
# This file defines ONLY the dev container. The Zabbix test stacks live in the
# repo-root ../docker-compose.test.yml, which devcontainer.json merges in
# alongside this file — they are deliberately not duplicated here. That
# duplication is exactly why the previous version of this file rotted out of
# date (it still targeted 4.0/5.0/5.4 on a shared MySQL).
#
# Because both files merge into one compose project, `dev` shares the project's
# default network with the Zabbix stacks and reaches them by service name
# (zabbix-web-60, zabbix-web-70, …) on port 8080. devcontainer.json sets
# ZBX_IN_CONTAINER=1 so the Makefile resolves ZABBIX_URL that way rather than
# via the published localhost ports.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VARIANT: 1-bullseye
        NODE_VERSION: lts/*
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
