# Release configuration producing the artifact set the Terraform and OpenTofu
# registries expect:
#   - one zip per platform
#   - a SHA256SUMS file
#   - a detached GPG signature of that file
#   - the registry manifest declaring the plugin protocol version
#
# Validate changes with `goreleaser check`, and dry run with
# `goreleaser build --snapshot --clean`.
version: 2

before:
  hooks:
    # do not use `go mod tidy` here: it rewrites go.mod/go.sum during a release
    - go mod verify

builds:
  - env:
      # CGO would complicate consumption in CI environments that cannot install
      # libraries
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: windows
        goarch: 'arm64'
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # --batch is required in a non-interactive pipeline
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    # the registry reads the supported plugin protocol versions from this file
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
